<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>obcAtlas • Dünya Haritası</title>
<link href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Etkileşimli dünya haritası"></div>
<header class="toolbar">
  <div class="brand"><span class="brand-icon">◎</span><span>obcAtlas <small id="subtitle">Dünya Rehberi</small></span></div>
  <form id="searchForm" class="search" autocomplete="off"><input id="searchInput" type="search" placeholder="Ülke, şehir, ada veya yer ara…" aria-label="Konum ara"><button type="submit" id="searchButton">Ara ↗</button><div id="searchResults" class="search-results" hidden aria-label="Arama sonuçları"></div></form>
  <div class="options"><button id="turkeyButton" title="Türkiye'ye git">Türkiye</button><button id="themeButton" aria-label="Temayı değiştir">☾ <span id="themeText">Koyu</span></button><button id="platesButton" aria-pressed="false">▦ <span id="platesText">Plakalar: Kapalı</span></button><button id="flagsButton" aria-pressed="true">⚑ <span id="flagsText">Bayraklar</span></button><button id="capitalButton" aria-pressed="true">★ <span id="capitalText">Başkentler</span></button><button id="languageButton" title="Harita dilini değiştir">TR ▾</button></div>
</header>
<aside id="info" class="info" hidden><button id="closeInfo" class="close" aria-label="Kapat">×</button><div class="eyebrow" id="infoKind">KONUM</div><h2 id="infoTitle"></h2><p id="infoDescription"></p><div id="infoCoords" class="coords"></div></aside>
<section id="catPanel" class="cat-panel" aria-label="irocero"><div id="catBubble" class="cat-bubble" role="status">Merhaba! Ben irocero. Bir ülke seçelim!</div><div class="cat-body"><button id="catAvatar" class="cat-avatar" aria-label="irocero kedisini sev" title="Sevmek için tıkla"><svg id="catSvg" viewBox="0 0 160 165" width="126" height="128" aria-hidden="true"><path class="cat-tail" d="M112 132 Q158 145 139 90" fill="none" stroke="var(--fur-dark)" stroke-width="14" stroke-linecap="round"/><ellipse cx="79" cy="131" rx="47" ry="30" fill="var(--fur)"/><path d="M38 75 L35 21 L63 43 Q80 34 98 43 L124 21 L121 78 Q124 121 80 123 Q36 121 38 75Z" fill="var(--fur)" stroke="var(--fur-dark)" stroke-width="3"/><path d="M42 32 L46 55 L60 46 Z M117 32 L114 55 L100 46 Z" fill="#df94a4"/><path class="cat-stripes" d="M65 49 L68 62 M80 46 L80 61 M95 49 L92 62" stroke="var(--fur-dark)" stroke-width="4" stroke-linecap="round"/><g class="cat-eyes"><ellipse cx="62" cy="79" rx="6" ry="9" fill="var(--cat-eye)"/><ellipse cx="98" cy="79" rx="6" ry="9" fill="var(--cat-eye)"/><ellipse cx="63.5" cy="77" rx="2" ry="5" fill="#182236"/><ellipse cx="99.5" cy="77" rx="2" ry="5" fill="#182236"/></g><path d="M74 96 L86 96 L80 103 Z" fill="#b95c71"/><path d="M80 103 Q73 112 67 105 M80 103 Q87 112 93 105" fill="none" stroke="#5b3e40" stroke-width="2.5" stroke-linecap="round"/><path d="M51 100 L28 94 M51 108 L25 110 M109 100 L132 94 M109 108 L135 110" stroke="var(--fur-dark)" stroke-width="2" stroke-linecap="round"/><path d="M55 146 Q62 151 70 146 M90 146 Q98 151 105 146" stroke="var(--fur-dark)" stroke-width="5" stroke-linecap="round"/></svg><span id="catEffect" class="cat-effect" aria-hidden="true"></span></button><div class="cat-controls"><strong>irocero <small id="catState">●</small></strong><div class="cat-meters"><label>♥ <progress id="happiness" max="100" value="75"></progress></label><label>🍽 <progress id="fullness" max="100" value="70"></progress></label></div><div class="cat-actions"><button id="feedButton" title="Besle">🐟</button><button id="petButton" title="Sev">♡</button><button id="napButton" title="Uyu / Uyan">☾</button><button id="catSettingsButton" title="Görünümü özelleştir">⚙</button></div></div></div><div id="catSettings" class="cat-settings" hidden><label>Style / Tarz <select id="catStyle"><option value="cartoon">Modern Cartoon</option><option value="pixel">Pixel Art</option><option value="minimal">Minimal</option></select></label><label>Color / Renk <select id="catColor"><option value="orange">Turuncu Tekir</option><option value="black">Siyah</option><option value="white">Beyaz-Gri</option></select></label><label>Eye color / Göz rengi <select id="catEye"><option value="amber">Bal / Amber</option><option value="green">Yeşil</option><option value="blue">Mavi</option></select></label><label><input type="checkbox" id="catMotion" checked> Animasyonlar</label><label><input type="checkbox" id="catFacts" checked> Coğrafi bilgiler</label><button id="hideCat">Kediyi gizle</button></div></section><button id="restoreCat" class="restore-cat" hidden>🐱 irocero</button><div class="bottom-left"><div class="hint" id="hint">Haritada bir yere tıkla veya arama yap</div><div class="status" id="status" role="status"></div></div>
<div class="legend" id="legend" hidden>Türkiye • <strong>81 il / plaka kodları</strong><span>Yakınlaşınca etiketler görünür</span></div>
<script type="module" src="app.js"></script>
</body></html>
